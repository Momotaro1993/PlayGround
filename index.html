<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Astral Summoner</title>
<style>
:root{--gold:#f7d889;--ink:#090d24;--violet:#9a83ff;--cyan:#65dbef}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080a1b;font-family:Georgia,'Times New Roman',serif;color:white}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#34346c 0,#17193d 34%,#090b20 68%,#050713 100%)}
#game{position:relative;width:min(100vw,1280px);height:100%;margin:auto;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.top{position:absolute;z-index:4;left:24px;right:24px;top:18px;height:66px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#aaa7cf;text-shadow:0 2px 8px #000}.brand b{display:block;margin-top:-1px;font-size:27px;letter-spacing:1px;color:white;font-style:italic}
.stats{display:flex;gap:8px}.pill{height:42px;min-width:104px;padding:8px 13px;border:1px solid #7772a9;border-radius:8px;background:linear-gradient(180deg,#24284ddd,#11132cdd);box-shadow:inset 0 1px #ffffff22,0 6px 16px #05050d66;text-align:right}.pill span{display:block;font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#a6a4c7}.pill b{font-size:18px;color:var(--gold)}
.runes{position:absolute;z-index:5;left:24px;bottom:24px;width:118px;padding:13px 10px 11px;border:1px solid #65638e;border-radius:12px;background:#11132ae8;box-shadow:0 14px 30px #05051199}.runes-title{font:10px Arial,sans-serif;letter-spacing:2px;text-align:center;color:#aaa8c9;margin-bottom:9px}.rune-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rune{height:26px;border:1px solid #58577e;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#aaa9cf;background:#191b3a}
.hand{position:absolute;z-index:6;bottom:18px;left:160px;right:160px;height:142px;display:flex;justify-content:center;gap:10px;pointer-events:none}.card{position:relative;width:112px;height:142px;border:1px solid #7774a8;border-radius:10px;background:linear-gradient(145deg,#31375f,#15172f 72%);box-shadow:0 10px 25px #050512aa,inset 0 1px #ffffff33;pointer-events:auto;cursor:pointer;transition:.16s transform,.16s filter;overflow:hidden}.card:hover{transform:translateY(-8px);filter:brightness(1.13)}.card:active{transform:translateY(-3px) scale(.97)}.card.lock{filter:saturate(.25);opacity:.78}.portrait{height:76px;margin:7px 7px 0;border:1px solid #77759c;border-radius:6px;display:grid;place-items:center;font-size:46px;text-shadow:0 4px 12px #000;background:radial-gradient(circle at 50 70%,var(--card),#171934 75%)}.card-name{text-align:center;font-size:12px;margin-top:6px;letter-spacing:.5px}.cost{position:absolute;left:8px;top:8px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font:700 12px Arial,sans-serif;color:#10132b;background:var(--gold);box-shadow:0 2px 8px #000}.card-type{position:absolute;right:7px;bottom:7px;font:8px Arial,sans-serif;color:#aaa8c9;letter-spacing:1px}
.wave{position:absolute;z-index:5;top:86px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}.wave small{display:block;font:9px Arial,sans-serif;letter-spacing:3px;color:#aaa8c9}.wave b{display:block;font-size:19px;margin-top:3px}.bar{width:190px;height:4px;margin:8px auto 0;border-radius:4px;background:#24264e;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c36cff,#65dbef);transition:width .2s}
.next{position:absolute;z-index:7;right:24px;bottom:26px;width:116px;height:54px;border:1px solid #8783ae;border-radius:8px;background:linear-gradient(180deg,#393f68,#1c203e);color:white;font:700 11px Arial,sans-serif;letter-spacing:1.5px;cursor:pointer;box-shadow:0 8px 20px #05051199}.next:hover{filter:brightness(1.15)}
#toast{position:absolute;z-index:10;left:50%;top:42%;transform:translate(-50%,-50%);padding:11px 22px;border:1px solid #817cae;border-radius:30px;background:#171936dd;font-size:17px;opacity:0;transition:.25s pointer-events:none}#toast.show{opacity:1}.burst{position:absolute;z-index:3;border-radius:50%;pointer-events:none;animation:pop .7s forwards}@keyframes pop{to{transform:scale(2.4);opacity:0}}
#overlay{position:absolute;z-index:20;inset:0;display:none;place-items:center;background:#07091bdd;backdrop-filter:blur(8px)}#overlay.show{display:grid}.modal{width:min(420px,calc(100vw - 40px));text-align:center;padding:32px;border:1px solid #7774a8;border-radius:16px;background:linear-gradient(145deg,#252849,#12142c);box-shadow:0 30px 80px #000}.modal h1{margin:0 0 8px;font-size:38px;font-style:italic}.modal p{color:#b9b8d1}.modal button{height:48px;padding:0 26px;border:1px solid #aaa3cf;border-radius:8px;background:#514d78;color:white;font:700 12px Arial,sans-serif;letter-spacing:2px;cursor:pointer}
@media(max-width:700px){.top{left:12px;right:12px;top:8px}.brand b{font-size:18px}.brand{font-size:9px}.stats{gap:4px}.pill{min-width:78px;height:38px;padding:6px 8px}.pill b{font-size:15px}.runes{left:8px;bottom:8px;width:82px;padding:8px 6px}.rune-row{gap:3px}.rune{height:20px;font-size:10px}.hand{left:94px;right:94px;bottom:8px;height:112px;gap:5px}.card{width:76px;height:112px}.portrait{height:61px;font-size:32px;margin:5px}.card-name{font-size:9px}.card-type{display:none}.cost{width:19px;height:19px;font-size:10px}.next{right:8px;bottom:9px;width:80px;height:44px;font-size:9px}.wave{top:60px}.wave b{font-size:14px}.bar{width:130px}}
</style></head>
<body><div id="game">
<canvas id="c"></canvas>
<div class="top"><div class="brand">THE ASTRAL <b>Sanctum</b></div><div class="stats"><div class="pill"><span>AETHER</span><b id="aether">100</b></div><div class="pill"><span>WAVE</span><b id="waveNo">1</b></div></div></div>
<div class="wave"><small>RIFT STATUS</small><b id="enemyCount">4 entities remain</b><div class="bar"><i id="progress"></i></div></div>
<div class="runes"><div class="runes-title">BOUND SOULS</div><div class="rune-row" id="runes"></div></div>
<div class="hand" id="hand"></div><button class="next" id="next">CALL WAVE</button><div id="toast">The rift stirs…</div>
<div id="overlay"><div class="modal"><h1 id="modalTitle">Sanctum Fallen</h1><p id="modalText">The astral rift consumed the circle.</p><button id="again">SUMMON AGAIN</button></div></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const cards=[{name:'Wisp',icon:'✦',cost:15,type:'SPIRIT',hp:55,dmg:9,color:'#65dbef',range:160},{name:'Stonegolem',icon:'◆',cost:30,type:'GUARDIAN',hp:150,dmg:14,color:'#b7a6d1',range:90},{name:'Fireborn',icon:'♨',cost:25,type:'ELEMENTAL',hp:75,dmg:20,color:'#ef7777',range:115},{name:'Moon Owl',icon:'◉',cost:20,type:'Familiar',hp:65,dmg:12,color:'#d1b4ff',range:180},{name:'Voidling',icon:'◈',cost:35,type:'VOID',hp:95,dmg:26,color:'#9c79ef',range:130}];
let units=[],enemies=[],particles=[],aether=100,wave=1,started=false,over=false,spawnCooldown=0,maxEnemies=4,toastT=0;
function drawCircle(x,y,r,alpha=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=`rgba(144,151,215,${alpha})`;ctx.lineWidth=1;ctx.stroke()}
function init(){units=[];enemies=[];particles=[];aether=100;wave=1;over=false;started=false;maxEnemies=4;document.getElementById('overlay').classList.remove('show');updateCards();updateUI();}
function startWave(){if(over)return;if(!started||enemies.length===0){started=true;let count=3+wave;maxEnemies=count;for(let i=0;i<count;i++)setTimeout(()=>{if(!over&&started)spawnEnemy()},i*550);showToast(wave===1?'A rift tears open':'The rift grows stronger')}}
function spawnEnemy(){let side=Math.random()<.5?1:-1;enemies.push({x:W*.5+side*(W*.31+Math.random()*40),y:H*.43+(Math.random()-.5)*H*.16,hp:40+wave*15,maxHp:40+wave*15,dmg:5+wave*2,speed:10+Math.random()*7,phase:Math.random()*6})}
function summon(card,screenX,screenY){if(over||aether<card.cost)return showToast('Not enough aether');aether-=card.cost;let x=screenX||W*.5+(Math.random()-.5)*220,y=screenY||H*.62;units.push({type:card,x,y,hp:card.hp,maxHp:card.hp,dmg:card.dmg,range:card.range,cd:Math.random(),phase:Math.random()*6,hit:0});burst(x,y,card.color);updateUI();updateCards()}
function burst(x,y,color){particles.push({x,y,color,life:1,max:1});for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,color,life:1,max:1,small:true})}
function updateCards(){let hand=document.getElementById('hand');hand.innerHTML='';cards.forEach(c=>{let el=document.createElement('div');el.className='card'+(aether<c.cost?' lock':'');el.style.setProperty('--card',c.color+'55');el.innerHTML=`<div class="cost">${c.cost}</div><div class="portrait">${c.icon}</div><div class="card-name">${c.name}</div><div class="card-type">${c.type}</div>`;el.onclick=e=>{let r=canvas.getBoundingClientRect();summon(c,W*.5+(Math.random()-.5)*220,H*.63+(Math.random()-.5)*50)};hand.appendChild(el)});let runes=document.getElementById('runes');runes.innerHTML='';for(let i=0;i<6;i++)runes.innerHTML+=`<div class="rune">${['◇','✦','◈','☾','△','◎'][i]}</div>`}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1400)}
function updateUI(){document.getElementById('aether').textContent=Math.floor(aether);document.getElementById('waveNo').textContent=wave;let remain=enemies.length;document.getElementById('enemyCount').textContent=remain?`${remain} entities remain`:'The rift is quiet';document.getElementById('progress').style.width=(started?Math.max(0,remain/maxEnemies*100):100)+'%'}
function gameOver(win){over=true;document.getElementById('overlay').classList.add('show');document.getElementById('modalTitle').textContent=win?'Rift Closed':'Sanctum Fallen';document.getElementById('modalText').textContent=win?'The astral gate has been sealed. Your summoned souls prevail.':'The astral rift consumed the circle.'}
canvas.addEventListener('pointerdown',e=>{if(over)return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y<H*.78)summon(cards[0],x,y)});
function loop(){let dt=.016;aether=Math.min(100,aether+dt*2);if(started&&enemies.length===0&&spawnCooldown<=0){spawnCooldown=3;setTimeout(()=>{if(!over&&started){wave++;if(wave>6){gameOver(true);return}updateUI();startWave()}},1500)}spawnCooldown=Math.max(0,spawnCooldown-dt);
for(let u of units){u.phase+=dt*2;u.cd-=dt;u.hit=Math.max(0,u.hit-dt);let near=null,dist=1e9;for(let e of enemies){let d=Math.hypot(e.x-u.x,e.y-u.y);if(d<dist&&d<u.range){near=e;dist=d}}if(near&&u.cd<=0){u.cd=.75+Math.random()*0.25;near.hp-=u.dmg;u.hit=.12;burst(near.x,near.y,u.type.color)}}
for(let e of enemies){e.phase+=dt*2;let cx=W*.5,cy=H*.63,d=Math.hypot(cx-e.x,cy-e.y);if(d>38){e.x+=(cx-e.x)/d*e.speed*dt;e.y+=(cy-e.y)/d*e.speed*dt}else if(!e.damageCd||e.damageCd<=0){for(let u of units)u.hp-=e.dmg*.12;e.damageCd=.7}e.damageCd=Math.max(0,(e.damageCd||0)-dt)}
for(let u of units)for(let e of enemies)if(Math.hypot(u.x-e.x,u.y-e.y)<35){u.hp-=e.dmg*dt*.25}
units=units.filter(u=>u.hp>0);enemies=enemies.filter(e=>e.hp>0);if(units.length===0&&aether<15&&started&&enemies.length>0&&wave>2){}if(started&&enemies.some(e=>Math.hypot(W*.5-e.x,H*.63-e.y)<55)){gameOver(false)}
particles=particles.filter(p=>p.life>0);for(let p of particles){p.life-=dt*(p.small?1.6:.8);if(p.small){p.x+=p.vx;p.y+=p.vy}}
updateUI();draw();requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);let cy=H*.63,cx=W*.5;
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.02);ctx.strokeStyle='rgba(139,145,205,.19)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,Math.min(W*.31,260),H*.19,0,0,Math.PI*2);ctx.stroke();ctx.rotate(.02);ctx.beginPath();ctx.ellipse(0,0,Math.min(W*.25,210),H*.14,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<12;i++){let a=i*Math.PI*2/12;ctx.beginPath();ctx.moveTo(Math.cos(a)*Math.min(W*.24,205),Math.sin(a)*H*.13);ctx.lineTo(Math.cos(a)*Math.min(W*.31,260),Math.sin(a)*H*.19);ctx.stroke()}ctx.restore();
for(let i=0;i<6;i++){let a=i*Math.PI*2/6+performance.now()/9000,x=cx+Math.cos(a)*Math.min(W*.34,330),y=cy-Math.sin(a)*H*.16;drawCircle(x,y,2+(i%2),.25)}
for(let u of units){let pulse=1+Math.sin(u.phase)*.05;ctx.save();ctx.translate(u.x,u.y);ctx.globalAlpha=.25;ctx.fillStyle=u.type.color;ctx.beginPath();ctx.arc(0,8,27*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${38*pulse}px Georgia`;ctx.shadowColor=u.type.color;ctx.shadowBlur=u.hit>0?24:8;ctx.fillStyle=u.type.color;ctx.fillText(u.type.icon,0,0);ctx.shadowBlur=0;ctx.fillStyle='#090b20';ctx.fillRect(-22,26,44,4);ctx.fillStyle=u.type.color;ctx.fillRect(-22,26,44*u.hp/u.maxHp,4);ctx.restore()} 
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y+Math.sin(e.phase)*3);ctx.fillStyle='#111329';ctx.strokeStyle='#df7084';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,20,25,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#df7084';ctx.beginPath();ctx.arc(-7,-5,3,0,7);ctx.arc(7,-5,3,0,7);ctx.fill();ctx.fillStyle='#090b20';ctx.fillRect(-23,28,46,4);ctx.fillStyle='#d85e7b';ctx.fillRect(-23,28,46*e.hp/e.maxHp,4);ctx.restore()}
for(let p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.small?3:28*(1-p.life),0,7);ctx.fill();ctx.restore()}}
canvas.addEventListener('contextmenu',e=>e.preventTarget);document.getElementById('next').onclick=startWave;document.getElementById('again').onclick=init;init();requestAnimationFrame(loop);
</script></body></html>

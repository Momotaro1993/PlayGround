for(let i=0;i<85;i++){const a=Math.random()*Math.PI*2,r=20+Math.random()*72,x=Math.cos(a)*r,z=Math.sin(a)*r;if(i<45){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35,1.1,7+Math.random()*8,7),trunkMat);tr.position.set(x,4,z);tr.rotation.z=(Math.random-.5)*.12;tr.castShadow=true;decor.add(tr);for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(2.5+j*.4,1),leafMat);crown.position.set(x+(Math.random-.5)*3,8+j*2,z+(Math.random-.5)*3);crown.scale.y=.8;crown.castShadow=true;decor.add(crown)}}else{const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*2,0),mat(i%2?0x5d6951:0x394638));rock.position.set(x,rock.geometry.parameters.radius*.25,z);rock.rotation.set(Math.random(),Math.random(),Math.random());rock.castShadow=true;decor.add(rock)}}

let hp=100,xp=0,level=1,kills=0,started=false,invul=0,dashCd=0,pulseCd=0,shake=0;const enemies=[],orbs=[],particles=[];

function initAudio(){ctx=new (window.AudioContext||window.webkitAudioContext);master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);const bass=ctx.createOscillator(),gain=ctx.createGain();bass.type='sawtooth';bass.frequency.value=55;gain.gain.value=.035;bass.connect(gain).connect(master);bass.start();musicTimer=setInterval(()=>{if(!ctx||ctx.state==='closed')return;step++;const f=[55,65.41,73.42,49][step%4],o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g).connect(master);g.gain.setValueAtTime(.018,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.7);o.start();o.stop(ctx.currentTime+.72)},950)}

function moveStick(e){const r=gamepad.getBoundingRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}pad.x=dx/max;pad.y=dy/max;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
gamepad.addEventListener('pointerdown',e=>{padPointer=e.pointerId;gamepad.setPointerCapture(e.pointerId);moveStick(e)});gamepad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)moveStick(e)});function releasePad(e){if(e.pointerId!==padPointer)return;padPointer=null;pad.x=0;pad.y=0;stick.style.transform='translate(-50%, -50%)'}gamepad.addEventListener('pointerup',releasePad);gamepad.addEventListener('pointercancel',releasePad);
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/16.67,2);last=now;if(started){let mx=(keys.d?1:0)-(keys.a?1:0)+pad.x,mz=(keys.s?1:0)-(keys.w?1:0)+pad.y;const len=Math.hypot(mx,mz)||1;mx/=len;mz/=len;let speed=(keys.shift&&dashCd<=0?1.45:.09)*dt;if(keys.shift&&dashCd<=0&&Math.hypot(mx,mz)){dashCd=260;burst(player.position,0xd9ed93,12)}player.position.x+=mx*speed*4.2;player.position.z+=mz*speed*4.2;player.position.x=Math.max(-78,Math.min(78,player.position.x));player.position.z=Math.max(-78,Math.min(78,player.position.z));if(Math.hypot(mx,mz))player.rotation.y=Math.atan2(mx,mz);if(mouseDown||swing>0){if(swing<=0){shoot();swing=18}else swing-=dt}else swing=Math.max(0,swing-dt);if(keys[' '])pulse();if(dashCd>0)dashCd-=dt;if(pulseCd>0)pulseCd-=dt;invul=Math.max(0,invul-dt);
for(const e of [...enemies]){const dir=player.position.clone().sub(e.position);const d=dir.length();dir.normalize();if(d<14){e.position.add(dir.multiplyScalar(e.userData.speed*dt));e.lookAt(player.position)}if(d<1.25&&invul<=0){hp-=6;invul=50;shake=12;document.getElementById('damage').classList.add('hit');setTimeout(()=>document.getElementById('damage').classList.remove('hit'),100);burst(player.position,0xb54d3a,8);sfx('hit');updateUI();if(hp<=0){hp=100;kills=0;xp=0;toast('THE SPECIES ENDURES')}}}
for(let i=orbs.length-1;i>=0;i--){const o=orbs[i],dir=player.position.clone().sub(o.position);if(dir.length()<8)o.position.add(dir.normalize().multiplyScalar(.18*dt));if(o.position.distanceTo(player.position)<.8){xp+=10;if(xp>=100){xp=0;level++;levelUp()}scene.remove(o);orbs.splice(i,1);updateUI();sfx('xp')}}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=.025*dt;if(p.userData.v)p.position.add(p.userData.v.clone().multiplyScalar(dt));if(p.material)p.material.opacity=Math.max(0,p.userData.life);p.scale.multiplyScalar(1+.015*dt);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
player.userData.step=(player.userData.step||0)+.12*dt;body.position.y=Math.sin(player.userData.step*2)*.04;updateUI();const target=player.position.clone().add(new THREE.Vector3(10,12,16));camera.position.lerp(target,.035*dt);camera.position.x+=Math.sin(now*.0007)*.15;camera.lookAt(player.position.x,1.2,player.position.z);if(shake>0){camera.position.x+=(Math.random-.5)*.12*shake*.1;shake-=dt}renderer.render(scene,camera)}
updateUI();animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script>

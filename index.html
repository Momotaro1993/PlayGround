<!doctype html>
<html lang="en">
<head>

<title>Stillwater Mahjong</title>
<style>
:root{--ink:#243c39;--muted:#758681;--jade:#426f62;--paper:#f8f6ee;--tile-w:clamp(54px,6.3vw,70px);--tile-h:calc(var(--tile-w)*1.24);--gap:5px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-serif,Georgia,"Times New Roman",serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(ellipse at 68% 12%,rgba(255,255,255,.92),transparent 30%),radial-gradient(ellipse at 5% 90%,rgba(173,203,181,.56),transparent 35%),linear-gradient(135deg,#e4eee8 0%,#e9e9dd 48%,#f2e9d9 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
button{font:inherit;color:inherit;cursor:pointer} .app{max-width:1440px;margin:auto;padding:20px 34px 26px;min-height:100vh;position:relative}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:17px;letter-spacing:.08em;text-transform:uppercase}.brand-mark{width:32px;height:32px;border:1px solid #6f8e7f;border-radius:50%;display:grid;place-items:center;color:#648273;font-size:17px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.soft-btn{border:1px solid rgba(71,100,89,.22);background:rgba(255,255,255,.42);border-radius:24px;padding:10px 15px;transition:.2s}.icon-btn:hover,.soft-btn:hover{background:#fff;transform:translateY(-1px)}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:17px}
.game-head{text-align:center;margin:15px 0 17px}.eyebrow{font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#7a9183}.game-head h1{font-size:clamp(30px,4vw,47px);font-weight:400;letter-spacing:.025em;margin:8px 0 5px;color:#29423d}.subtitle{font-size:15px;color:#82918b;font-style:italic}
.toolbar{display:flex;align-items:center;justify-content:center;gap:22px;margin:17px auto 13px}.stat{min-width:76px;text-align:center}.stat label{display:block;font:10px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.16em;color:#87968f}.stat strong{display:block;font:19px system-ui,sans-serif;font-weight:400;color:#334b43;margin-top:3px}.tool-divider{height:29px;width:1px;background:#a6b5aa}.tool-btn{border:1px solid rgba(75,106,94,.22);background:rgba(255,255,255,.54);border-radius:22px;padding:9px 16px;font-size:13px;letter-spacing:.02em;transition:.2s}.tool-btn:hover{background:#fff;box-shadow:0 6px 20px #657c6624}.tool-btn:disabled{opacity:.42;cursor:default}
.stage-wrap{position:relative;margin:0 auto;width:min(100%,1000px);min-height:440px;display:flex;align-items:center;justify-content:center;perspective:1400px}.stage-glow{position:absolute;width:74%;height:62%;top:20%;background:radial-gradient(ellipse,rgba(86,125,101,.18),transparent 70%);filter:blur(22px)}.board{position:relative;transform-style:preserve-3d;transform:rotateX(8deg);width:calc(var(--tile-w)*8 + var(--gap)*9 + 14px);height:calc(var(--tile-h)*6 + var(--gap)*7 + 34px);max-width:100%;}
.tile{position:absolute;width:var(--tile-w);height:var(--tile-h);padding:4px;border-radius:9px;background:linear-gradient(145deg,#fffef7,#f1eee1);border:1px solid #d5d3c5;box-shadow:inset 0 0 0 1px #fff,0 2px 0 #d2d0c3,0 4px 0 #b9b9aa,0 7px 12px rgba(43,61,51,.18);display:flex;align-items:center;justify-content:center;transform:translateZ(var(--base-z,0px));transition:transform .19s,filter .19s,box-shadow .19s,opacity .2s;user-select:none;touch-action:manipulation;z-index:var(--z);}
.tile:after{content:"";position:absolute;inset:4px;border:1px solid rgba(192,190,170,.58);border-radius:6px;pointer-events:none}.tile .face{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}.tile .glyph{font-size:clamp(19px,2.1vw,30px);text-shadow:0 1px 0 #fff;line-height:1}.tile .tiny{font:600 clamp(6px,.65vw,8px)/1.25 system-ui,sans-serif;letter-spacing:0;color:#879188;margin-top:4px;white-space:nowrap}.tile.suit-dot .glyph{color:#bb654e}.tile.suit-bam .glyph{color:#4b8567}.tile.suit-char .glyph{color:#4b6c9b}.tile.honor .glyph{font-size:clamp(22px,2.3vw,32px);color:#bf8b49}.tile.flower{background:linear-gradient(145deg,#fffdf5,#f4ebdc)}.tile.flower .glyph{color:#bc7d77}.tile.free{cursor:pointer}.tile.free:hover{transform:translateY(-7px) translateZ(calc(var(--base-z,0px) + 8px));box-shadow:inset 0 0 0 1px white,0 3px 0 #d2d0c3,0 6px 0 #b9b9aa,0 14px 19px rgba(43,61,51,.22);filter:brightness(1.025)}.tile.blocked{filter:saturate(.76) brightness(.98)}.tile.selected{transform:translateY(-10px) translateZ(calc(var(--base-z,0px) + 12px));outline:2px solid #81a58e;outline-offset:2px;box-shadow:0 0 0 5px #c5d8c590,0 13px 22px #334a3d40}.tile.matched{opacity:0;transform:translateY(-15px) scale(.8);pointer-events:none}.board.pulse .tile.free{animation:softpulse 1.15s ease-in-out}@keyframes softpulse{50%{filter:brightness(1.12);transform:translateY(-4px)}}
.board-caption{text-align:center;color:#88968e;font:11px system-ui,sans-serif;letter-spacing:.06em;margin-top:-3px}.bottomline{display:flex;justify-content:center;gap:18px;align-items:center;color:#87938c;font-size:13px;margin:16px 0 0}.bottomline .dot{width:3px;height:3px;background:#91a398;border-radius:50%}.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);padding:12px 20px;border:1px solid #e4e6d9;border-radius:30px;background:rgba(255,255,250,.94);box-shadow:0 10px 30px #354a3920;color:#43594e;font:13px system-ui,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:#233a3470;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(540px,100%);background:linear-gradient(145deg,#fffef8,#f1f0e5);border:1px solid #fff;border-radius:22px;padding:32px;box-shadow:0 25px 80px #17372e35;text-align:center}.modal h2{font-size:29px;font-weight:400;margin:2px 0 8px}.modal p{color:#78877f;font-size:14px;line-height:1.6}.level-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}.level-card{border:1px solid #dbe1d6;border-radius:13px;padding:15px 7px;background:#ffffff8c;cursor:pointer;transition:.2s}.level-card:hover,.level-card.current{border-color:#86a28d;background:#edf3e9;transform:translateY(-2px)}.level-card b{display:block;font-size:14px;font-weight:500}.level-card span{display:block;font:10px system-ui,sans-serif;color:#84938a;margin-top:6px}.modal-close{margin-top:8px}.win-mark{font-size:43px;color:#bd9870;margin:6px}.rules{max-width:400px;margin:15px auto 22px!important}
@media(max-width:760px){:root{--tile-w:clamp(35px,8.35vw,56px);--gap:3px}.app{padding:10px 12px 22px}.topbar{height:48px}.brand{font-size:13px}.game-head{margin:9px 0 8px}.subtitle{font-size:13px}.toolbar{gap:9px;margin:12px auto}.stat{min-width:51px}.stat label{font-size:8px}.stat strong{font-size:16px}.tool-btn{font-size:11px;padding:8px 11px}.stage-wrap{min-height:calc(var(--tile-h)*6 + 30px);overflow:visible}.board{height:calc(var(--tile-h)*6 + var(--gap)*7 + 28px);transform:rotateX(5deg)}.tile{padding:2px;border-radius:6px}.tile:after{inset:3px;border-radius:4px}.tile .tiny{font-size:6px;margin-top:3px}.bottomline{font-size:11px;margin-top:9px}.app{min-height:100svh}}
@media(max-width:390px){:root{--tile-w:8.1vw}.top-actions{gap:5px}.soft-btn{padding:8px 10px;font-size:12px}.stage-wrap{margin-left:-7px;width:calc(100% + 14px)}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">❋</span><span>Stillwater Mahjong</span></div><div class="top-actions"><button class="soft-btn" id="levelsBtn">Garden 01　⌄</button><button class="icon-btn" id="musicBtn" aria-label="Toggle ambient music" title="Ambient music">♫</button><button class="icon-btn" id="soundBtn" aria-label="Toggle sound effects" title="Sound effects">◖))</button></div></header>
<section class="game-head"><div class="eyebrow">A moment of quiet</div><h1 id="boardTitle">The Quiet Garden</h1><div class="subtitle" id="boardSubtitle">Breathe in. Let the pieces fall away.</div></section>
<section class="toolbar" aria-label="Game controls"><div class="stat"><label>Pairs left</label><strong id="pairsStat">30</strong></div><div class="tool-divider"></div><div class="stat"><label>Time</label><strong id="timeStat">00:00</strong></div><div class="tool-divider"></div><button class="tool-btn" id="hintBtn">✧　Hint</button><button class="tool-btn" id="undoBtn" disabled>↶　Undo</button><button class="tool-btn" id="restartBtn">↻　Restart</button></section>
<div class="stage-wrap"><div class="stage-glow"></div><div class="board" id="board" aria-label="Mahjong tile board"></div></div><div class="board-caption" id="boardCaption">A pair is free when it has no tile above, and one open side.</div>
<footer class="bottomline"><span id="progressText">A clear path is waiting</span><i class="dot"></i><span>Every garden has a way through</span></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modalContent"></section></div>
<script>
const LEVELS=[
 {name:'The Quiet Garden',short:'Garden 01',subtitle:'Breathe in. Let the pieces fall away.',shape:'garden',mood:'A gentle beginning',rows:6,cols:8,tiers:[{z:0,w:8,h:6},{z:1,w:4,h:2},{z:2,w:2,h:2}]},
 {name:'The Moonlit Pavilion',short:'Pavilion 02',subtitle:'Follow the lantern light through the stillness.',shape:'pavilion',mood:'A little more to uncover',rows:6,cols:8,tiers:[{z:0,w:8,h:6},{z:1,w:6,h:2},{z:2,w:4,h:2},{z:3,w:2,h:2}]},
 {name:'The Crane’s Crossing',short:'Crane 03',subtitle:'Find your own rhythm, one quiet match at a time.',shape:'crane',mood:'For a wandering mind',rows:6,cols:8,tiers:[{z:0,w:8,h:6},{z:1,w:4,h:4},{z:2,w:2,h:2}]}
];
const FACES=[
 {name:'Bamboo one',glyph:'𓇢',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo two',glyph:'Ⅱ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo three',glyph:'Ⅲ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo four',glyph:'Ⅳ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo five',glyph:'Ⅴ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo six',glyph:'Ⅵ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo seven',glyph:'Ⅶ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo eight',glyph:'Ⅷ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'}, {name:'Bamboo nine',glyph:'Ⅸ',cls:'suit-bam',kind:'suit',tiny:'BAMBOO'},
 {name:'Circles one',glyph:'●',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles two',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles three',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles four',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles five',glyph:'✿',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles six',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles seven',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles eight',glyph:'◉',cls:'suit-dot',kind:'suit',tiny:'DOTS'}, {name:'Circles nine',glyph:'❋',cls:'suit-dot',kind:'suit',tiny:'DOTS'},
 {name:'Characters one',glyph:'一',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters two',glyph:'二',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters three',glyph:'三',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters four',glyph:'四',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters five',glyph:'五',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters six',glyph:'六',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters seven',glyph:'七',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters eight',glyph:'八',cls:'suit-char',kind:'suit',tiny:'CHARS'}, {name:'Characters nine',glyph:'九',cls:'suit-char',kind:'suit',tiny:'CHARS'},
 {name:'Plum blossom',glyph:'✿',cls:'flower',kind:'flower',tiny:'FLOWER'}, {name:'Orchid',glyph:'❀',cls:'flower',kind:'flower',tiny:'ORCHID'}, {name:'Chrysanthemum',glyph:'✽',cls:'flower',kind:'flower',tiny:'FLOWER'}, {name:'Bamboo flower',glyph:'❋',cls:'flower',kind:'flower',tiny:'BAMBOO'}
];
const board=document.querySelector('#board');let levelIndex=0,tiles=[],selected=null,undoStack=[],moves=0,seconds=0,timer=null,toastTimer=null,hintTimeout=null,musicOn=false,sfxOn=true,audioCtx=null,musicTimer=null,musicStep=0;
const $=s=>document.querySelector(s);
function tileKey(x,y,z){return `${x},${y},${z}`}
function buildLayout(level){const out=[];for(const tier of level.tiers){const ox=(level.cols-tier.w)/2,oy=(level.rows-tier.h)/2;for(let y=0;y<tier.h;y++)for(let x=0;x<tier.w;x++)out.push({x:x+ox,y:y+oy,z:tier.z,id:tileKey(x+ox,y+oy,tier.z)});}return out}
function getFree(tile){if(tile.removed)return false;const above=tiles.some(t=>!t.removed&&t.z>tile.z&&Math.abs(t.x-tile.x)<.98&&Math.abs(t.y-tile.y)<.98);if(above)return false;const left=tiles.some(t=>!t.removed&&t.z===tile.z&&t.y===tile.y&&Math.abs(t.x-(tile.x-1))<.01);const right=tiles.some(t=>!t.removed&&t.z===tile.z&&t.y===tile.y&&Math.abs(t.x-(tile.x+1))<.01);return !left||!right}
function makeDeal(level){const layout=buildLayout(level),order=[];for(let z=level.tiers.length-1;z>=0;z--){const tier=level.tiers[z],ox=(level.cols-tier.w)/2,oy=(level.rows-tier.h)/2;for(let y=0;y<tier.h;y++){for(let x=0;x<tier.w/2;x++){order.push(layout.find(t=>t.z===z&&t.y===oy+y&&t.x===ox+x));order.push(layout.find(t=>t.z===z&&t.y===oy+y&&t.x===ox+tier.w-1-x));}}}
// Give each consecutive, guaranteed-removable pair a matching face.
const deck=FACES.slice();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}const pairFaces=[];while(pairFaces.length<layout.length/2){pairFaces.push(deck[pairFaces.length%deck.length]);}for(let i=0;i<order.length;i+=2){order[i].face=pairFaces[i/2];order[i+1].face=pairFaces[i/2];}return layout}
function setupLevel(index,keepTime=false){levelIndex=(index+LEVELS.length)%LEVELS.length;const level=LEVELS[levelIndex];tiles=makeDeal(level);selected=null;undoStack=[];moves=0;if(!keepTime)seconds=0;updateHeader();render();updateStats();startTimer()}
function updateHeader(){const l=LEVELS[levelIndex];$('#boardTitle').textContent=l.name;$('#boardSubtitle').textContent=l.subtitle;$('#levelsBtn').textContent=l.short+'　⌄'}
function render(){board.innerHTML='';for(const t of tiles){const el=document.createElement('button');const free=getFree(t);el.className=`tile ${t.face.cls} ${free?'free':'blocked'} ${t.id===selected?'selected':''} ${t.removed?'matched':''}`;el.style.setProperty('--z',t.z*100+10);el.style.setProperty('--base-z',`${t.z*10}px`);const stepX=`calc(var(--tile-w) + var(--gap))`,stepY=`calc(var(--tile-h) + var(--gap))`;el.style.left=`calc(7px + ${t.x} * ${stepX})`;el.style.top=`calc(7px + ${t.y} * ${stepY} - ${t.z} * 5px)`;el.dataset.tileId=t.id;el.setAttribute('aria-label',`${t.face.name}${free?', free':' , blocked'}`);el.innerHTML=`<span class="face"><span class="glyph">${t.face.glyph}</span><span class="tiny">${t.face.tiny}</span></span>`;if(free)el.addEventListener('click',()=>selectTile(t));board.appendChild(el)}$('#undoBtn').disabled=!undoStack.length;}
function updateStats(){$('#pairsStat').textContent=tiles.filter(t=>!t.removed).length/2;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('#timeStat').textContent=`${m}:${s}`;$('#progressText').textContent=moves?`${moves} quiet ${moves===1?'match':'matches'} made`:'A clear path is waiting';}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{seconds++;updateStats()},1000)}
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function selectTile(t){if(!getFree(t))return;ensureAudio();if(selected===t.id){selected=null;render();return}if(!selected){selected=t.id;render();playTone(480,.08);return}const first=tiles.find(a=>a.id===selected);if(first&&first.face===t.face){undoStack.push([first.id,t.id]);first.removed=t.removed=true;selected=null;moves++;playMatch();render();updateStats();if(tiles.every(a=>a.removed)){clearInterval(timer);setTimeout(()=>showWin(),450)}}else{selected=t.id;render();playTone(230,.11);notify('Not quite a pair. Let your eyes wander.')}}
function hint(){const free=tiles.filter(t=>getFree(t));let pair;for(let i=0;i<free.length;i++){pair=free.slice(i+1).find(t=>t.face===free[i].face);if(pair){pair=[free[i],pair];break}}if(!pair){notify('Take a breath, then try another way.');return}board.classList.remove('pulse');void board.offsetWidth;board.classList.add('pulse');for(const t of pair){const el=[...board.children].find(e=>e.dataset.tileId===t.id);if(el){el.style.outline='2px solid #c59b5f';setTimeout(()=>{if(el.isConnected)el.style.outline=''},1100)}}notify('A pair is waiting in the garden.');}
function undo(){const pair=undoStack.pop();if(!pair)return;for(const id of pair){const t=tiles.find(a=>a.id===id);t.removed=false}moves=Math.max(0,moves-1);selected=null;render();updateStats();startTimer();notify('One step gently returned.')}
function restart(){setupLevel(levelIndex);notify('The garden has been made anew.')}
function openLevels(){const modal=$('#modalContent');modal.innerHTML=`<div class="eyebrow">Choose your quiet place</div><h2>Three gardens to wander</h2><p>Each layout is gently arranged so a matching path is always there.</p><div class="level-list">${LEVELS.map((l,i)=>`<button class="level-card ${i===levelIndex?'current':''}" data-level="${i}"><b>${l.short}</b><span>${l.mood}</span></button>`).join('')}</div><button class="tool-btn modal-close" id="modalClose">Return to the garden</button>`;$('#modalBackdrop').classList.add('open');modal.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{$('#modalBackdrop').classList.remove('open');setupLevel(Number(btn.dataset.level));notify(`${LEVELS[levelIndex].name}, freshly laid.`)}));$('#modalClose').onclick=()=>$('#modalBackdrop').classList.remove('open')}
function showWin(){const modal=$('#modalContent');modal.innerHTML=`<div class="win-mark">✿</div><div class="eyebrow">The garden is at rest</div><h2>Beautifully done.</h2><p>You found every pair in ${$('#timeStat').textContent}. Take this quiet with you.</p><button class="tool-btn" id="nextLevel">${levelIndex<LEVELS.length-1?'Wander to the next garden':'Visit the first garden again'}　→</button><div><button class="tool-btn modal-close" id="closeWin">Stay a little longer</button></div>`;$('#modalBackdrop').classList.add('open');$('#nextLevel').onclick=()=>{$('#modalBackdrop').classList.remove('open');setupLevel((levelIndex+1)%LEVELS.length)};$('#closeWin').onclick=()=>$('#modalBackdrop').classList.remove('open')}
function showRules(){const modal=$('#modalContent');modal.innerHTML=`<div class="eyebrow">A small guide</div><h2>How to play</h2><p class="rules">Find two matching tiles and tap them to let them drift away. A tile is free when there is no tile resting above it and at least one of its long sides is open. Use <b>Hint</b> whenever you need a gentle nudge. Every garden has a guaranteed path to completion.</p><button class="tool-btn" id="rulesClose">Begin again</button>`;$('#modalBackdrop').classList.add('open');$('#rulesClose').onclick=()=>$('#modalBackdrop').classList.remove('open')}
function ensureAudio(){if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)audioCtx=new Ctx()}if(audioCtx?.state==='suspended')audioCtx.resume()}
function playTone(freq,duration=.16,type='sine',volume=.035){if(!sfxOn)return;ensureAudio();if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}
function playMatch(){if(!sfxOn)return;playTone(540,.17,'sine',.04);setTimeout(()=>playTone(720,.22,'sine',.027),95)}
function startMusic(){ensureAudio();if(!audioCtx)return;musicOn=true;$('#musicBtn').classList.add('current');$('#musicBtn').style.background='#eaf0e8';const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];const play=()=>{if(!musicOn)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=notes[musicStep%notes.length];filter.type='lowpass';filter.frequency.value=700;gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.012,now+1.6);gain.gain.exponentialRampToValueAtTime(.0001,now+5.4);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+5.5);musicStep++;musicTimer=setTimeout(play,3900)};play()}
function stopMusic(){musicOn=false;clearTimeout(musicTimer);$('#musicBtn').classList.remove('current');$('#musicBtn').style.background=''}
$('#hintBtn').addEventListener('click',hint);$('#undoBtn').addEventListener('click',undo);$('#restartBtn').addEventListener('click',restart);$('#levelsBtn').addEventListener('click',openLevels);$('#musicBtn').addEventListener('click',()=>{ensureAudio();if(musicOn)stopMusic();else startMusic()});$('#soundBtn').addEventListener('click',()=>{sfxOn=!sfxOn;$('#soundBtn').style.opacity=sfxOn?'1':'.48';if(sfxOn){ensureAudio();playTone(580)}});$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))$('#modalBackdrop').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalBackdrop').classList.remove('open');if(e.key.toLowerCase()==='h')hint();if(e.key.toLowerCase()==='u')undo()});
setupLevel(0);setTimeout(()=>{if(!localStorage.getItem('stillwater-intro')){showRules();localStorage.setItem('stillwater-intro','seen')}},500);
</script>
